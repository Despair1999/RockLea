name: Quality and builds
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rocklea_test
          POSTGRES_USER: rocklea
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rocklea -d rocklea_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vitest run tests/integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://rocklea:integration-only@localhost:5432/rocklea_test
      - run: pnpm build
      - run: pnpm simulate:match
      - run: docker build -t rocklea:ci .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm collector:build
      - run: ./release/RLStatsCollector.exe --version
      - name: Build installer with preinstalled Inno Setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - name: Verify installer in disposable runner
        shell: pwsh
        run: |
          $testInstallPath = Join-Path $env:RUNNER_TEMP 'RockLeaInstallTest'
          $installer = Start-Process -FilePath './release/RLStatsCollector-Setup.exe' -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $testInstallPath + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw 'Installer failed.' }
          & (Join-Path $testInstallPath 'RLStatsCollector.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed collector failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: RLStatsCollector-Windows-x64
          path: release/*.exe
