name: Quality and builds
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rocklea_test
          POSTGRES_USER: rocklea
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rocklea -d rocklea_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vitest run tests/integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://rocklea:integration-only@localhost:5432/rocklea_test
      - run: pnpm build
      - run: pnpm simulate:match
      - run: docker build -t rocklea:ci .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm collector:build
      - run: ./release/RLStatsCollector.exe --version
      - run: pnpm host:build
      - run: pnpm exec tsx scripts/verify-icon.ts release/host/RockLea.exe
      - name: Portable application startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath './release/host/RockLea.exe' -ArgumentList '--smoke' -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Portable smoke failed.' }
          & ./release/host/RockLea.exe --version
      - name: Build installer with preinstalled Inno Setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Legacy layout installer compilation failed.' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/host-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          pnpm exec tsx scripts/verify-icon.ts release/RockLea-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer icon verification failed.' }
      - name: Install, upgrade and uninstall preserve data
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.3.0 --pattern RockLea-Setup.exe --dir (Join-Path $env:RUNNER_TEMP 'RockLeaPrevious')
          if ($LASTEXITCODE -ne 0) { throw 'Could not obtain previous verified release.' }
          ./scripts/test-installer.ps1 -PreviousInstaller (Join-Path $env:RUNNER_TEMP 'RockLeaPrevious/RockLea-Setup.exe')
      - name: Package portable application and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path './release/host/*' -DestinationPath './release/RockLea-Portable.zip'
          Expand-Archive -Path './release/RockLea-Portable.zip' -DestinationPath (Join-Path $env:RUNNER_TEMP 'RockLeaPortableExtract')
          $portable = Start-Process -FilePath (Join-Path $env:RUNNER_TEMP 'RockLeaPortableExtract/RockLea.exe') -ArgumentList '--smoke' -WindowStyle Hidden -Wait -PassThru
          if ($portable.ExitCode -ne 0) { throw 'Extracted portable package failed.' }
          $manifest = @('RockLea-Setup.exe','RockLea-Portable.zip') | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path './release' $_)).Hash.ToLower()
            $hash + '  ' + $_
          }
          $manifest | Set-Content -Encoding ascii './release/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: RockLea-Windows-x64
          path: |
            release/RockLea-Setup.exe
            release/RockLea-Portable.zip
            release/SHA256SUMS.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: RockLea-Windows-x64
          path: release
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/RockLea-Setup.exe release/RockLea-Portable.zip release/SHA256SUMS.txt --verify-tag --title "RockLea $RELEASE_TAG" --notes-file docs/RELEASE_0.3.1.md
