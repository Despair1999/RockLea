services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rocklea
      POSTGRES_USER: rocklea
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rocklea -d rocklea"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    command: [node, dist/scripts/migrate.js]
    environment:
      DATABASE_URL: postgresql://rocklea:${DB_PASSWORD}@db:5432/rocklea
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rocklea:${DB_PASSWORD}@db:5432/rocklea
      HOST: 0.0.0.0
      PORT: 3000
      BACKEND_PUBLIC_URL: https://${PUBLIC_HOST:?Set PUBLIC_HOST}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"
  bot:
    build: .
    restart: unless-stopped
    command: [node, dist/apps/bot/main.js]
    env_file: .env
    environment:
      BACKEND_INTERNAL_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    logging:
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
volumes:
  postgres:
  caddy_data:
  caddy_config:
